# suppress inspection "UnusedProperty" for whole file -- These properties are used in the automation framework
#Change_these_as_needed
TEST_OUTPUT_DIRECTORY=reports/ios
SCREEN_SHOTS=reports/ios
BUILD_NUMBER=284
GLOBAL_WAIT=30
NO_RESET=true
SCREEN_RECORD=false
REPORTER_NAME=extent
NEW_COMMAND_TIMEOUT=1800
CUSTOM_APPIUM=false

#app
# Defaults to the pre-installed iOS Settings app so the stack can be verified with no app build,
# no IPA and no signing. Point BUNDLE_ID at your own app (and set IPA_LOCATION if the build needs
# installing first) when you test something real.
BUNDLE_ID=com.apple.Preferences
#IPA_LOCATION=/absolute/path/to/YourApp.app

#iOS
XCUITestDriver=true
AUTOMATION_NAME=XCUITest
TESTS_NAME=Automation Tests
# Appium 2 serves at the root path; do NOT add the Appium 1 style /wd/hub suffix here.
LOCAL_URL=http://127.0.0.1:4723/
APPIUM_VERSION=2.19.0

# Simulator under test. Get these from: xcrun simctl list devices available
PLATFORM_NAME=iOS
PLATFORM_VERSION=26.0
DEVICE_NAME=iPhone 17 Pro
UDID=9800E4B5-184E-4911-B42D-D4FF29B0031B
