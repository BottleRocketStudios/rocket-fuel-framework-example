# suppress inspection "UnusedProperty" for whole file -- These properties are used in the automation framework
#Change_these_as_needed
TEST_OUTPUT_DIRECTORY=reports/android
SCREEN_SHOTS=reports/android
BUILD_NUMBER=284
GLOBAL_WAIT=20
# The uiautomator2 driver does NOT launch the app when noReset is true - it assumes the app is
# already running, and the session comes up on the launcher. Keep this false so APP_ACTIVITY is
# actually started. For a real app where you need to preserve state between tests, set this true
# and launch the app yourself from a UserOperation.
NO_RESET=false
SCREEN_RECORD=false
HEADLESS_EMULATOR=false
REPORTER_NAME=extent
NEW_COMMAND_TIMEOUT=1800
CUSTOM_APPIUM=false

#app
# Defaults to the stock Settings app so the Android stack can be verified with no app build and no
# APK. Point APP_PACKAGE/APP_ACTIVITY at your own app (and set APK_LOCATION if it needs installing
# first) when you test something real.
APP_PACKAGE=com.android.settings
APP_ACTIVITY=.Settings
#APK_LOCATION=/absolute/path/to/yourapp.apk

#Android
AUTOMATION_NAME=UiAutomator2
TESTS_NAME=Automation Tests
# Appium 2 serves at the root path; do NOT add the Appium 1 style /wd/hub suffix here.
LOCAL_URL=http://127.0.0.1:4723/
APPIUM_VERSION=2.19.0

# Emulator under test. Get the udid from `adb devices` (emulator-5554 is the first running emulator)
# and the AVD list from `avdmanager list avd`.
PLATFORM_NAME=Android
PLATFORM_VERSION=16
DEVICE_NAME=rff_api36
UDID=emulator-5554

#There are a lot of other Android capabilities which may be useful in the future, here are a few
#appWaitActivity
#dontStopAppOnReset
